<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b1220" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="כדורגל 3D" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>כדורגל 3D</title>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="ui"><div class="boot" id="boot">טוען את האצטדיון…</div></div>
    <script>
      // An open window can still ask for files an update replaced: reload once.
      (function () {
        var KEY = 'football-reloaded';
        addEventListener('error', function (e) {
          var t = e.target;
          if (!t || (t.tagName !== 'SCRIPT' && t.tagName !== 'LINK')) return;
          try {
            if (sessionStorage.getItem(KEY)) return;
            sessionStorage.setItem(KEY, '1');
          } catch (err) {}
          location.reload();
        }, true);
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
