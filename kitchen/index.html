<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e11d48" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="המטבח שלי" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>המטבח שלי</title>
  </head>
  <body>
    <div id="root"><div class="boot" id="boot">טוען…</div></div>
    <script>
      // After an app update an open window can still ask for files the update replaced.
      // Reload once to pick up the new version, and never leave a blank page.
      (function () {
        var KEY = 'kitchen-reloaded';
        function reloadOnce() {
          try {
            if (sessionStorage.getItem(KEY)) return false;
            sessionStorage.setItem(KEY, '1');
          } catch (e) {}
          location.reload();
          return true;
        }
        addEventListener('error', function (e) {
          var t = e.target;
          if (t && (t.tagName === 'SCRIPT' || t.tagName === 'LINK')) reloadOnce();
        }, true);
        setTimeout(function () {
          var boot = document.getElementById('boot');
          if (!boot) return;
          boot.innerHTML = 'הטעינה לוקחת יותר מדי זמן. <button type="button" id="boot-retry">רענון</button>';
          document.getElementById('boot-retry').onclick = function () {
            try { sessionStorage.removeItem(KEY); } catch (e) {}
            location.reload();
          };
        }, 15000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
