name: כותבים נכון – Android App Bundle

# Builds the .aab for Google Play. Download it from the run page → "Artifacts".
on:
  push:
    paths:
      - 'kotvim-nachon/**'
      - '.github/workflows/kotvim-nachon-android.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: kotvim-nachon

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kotvim-nachon/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Tests & typecheck
        run: |
          npm test
          npx tsc -b

      - name: Build web app
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
          VITE_ADMOB_INTERSTITIAL_ID: ${{ secrets.ADMOB_INTERSTITIAL_ID }}
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Firebase config for Android (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json added"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set – Google sign-in will be disabled in this build"
          fi

      - name: Upload key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set – the bundle will be UNSIGNED and Google Play will not accept it"
          fi

      - name: Build release bundle
        working-directory: kotvim-nachon/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
        run: |
          chmod +x gradlew
          EXTRA=""
          if [ -n "$ADMOB_APP_ID" ]; then EXTRA="-PadmobAppId=$ADMOB_APP_ID"; fi
          ./gradlew bundleRelease --no-daemon -PversionCode=${{ github.run_number }} $EXTRA

      - uses: actions/upload-artifact@v4
        with:
          name: kotvim-nachon-aab-${{ github.run_number }}
          path: kotvim-nachon/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
