name: כותבים נכון – Android App Bundle

# Builds the .aab for Google Play (run page → "Artifacts") and an installable .apk that is published
# as the release "kotvim-nachon-latest" – a fixed download link for phones.
on:
  push:
    paths:
      - 'kotvim-nachon/**'
      - '.github/workflows/kotvim-nachon-android.yml'
  workflow_dispatch:

permissions:
  # write: to publish the .apk as a GitHub release
  contents: write

defaults:
  run:
    working-directory: kotvim-nachon

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: kotvim-nachon/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Tests & typecheck
        run: |
          npm test
          npx tsc -b

      - name: Check content with the Hebrew spell checker (hspell)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq hspell
          npm run validate-content -- --check

      # optional: a voice that may be used in a paid app (Google neural voice) instead of Phonikud
      - uses: actions/cache@v4
        with:
          path: kotvim-nachon/voice/cache-cloud
          key: cloud-voice-${{ hashFiles('kotvim-nachon/voice/texts.json') }}
          restore-keys: cloud-voice-
      - name: Natural cloud voice (optional)
        env:
          GOOGLE_TTS_API_KEY: ${{ secrets.GOOGLE_TTS_API_KEY }}
        run: |
          if [ -n "$GOOGLE_TTS_API_KEY" ]; then
            node --experimental-strip-types scripts/voice-texts.ts
            python3 scripts/voice-build-cloud.py
          else
            echo "GOOGLE_TTS_API_KEY not set – using the recorded Phonikud voice"
          fi

      - name: Build web app
        env:
          VITE_FIREBASE_CONFIG: ${{ secrets.FIREBASE_WEB_CONFIG }}
        run: npx vite build

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Firebase config for Android (optional)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json added"
          else
            echo "::warning::GOOGLE_SERVICES_JSON secret not set – Google sign-in will be disabled in this build"
          fi

      - name: Upload key (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set – the bundle will be UNSIGNED and Google Play will not accept it"
          fi

      - name: Build release bundle
        working-directory: kotvim-nachon/android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon -PversionCode=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: kotvim-nachon-aab-${{ github.run_number }}
          path: kotvim-nachon/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      # ---- installable .apk for direct download ----
      - name: Signing key for the .apk
        run: |
          if [ -z "$KEYSTORE_FILE" ]; then
            # no upload key yet: a one-off key, so the .apk installs (updates need the old version removed first)
            keytool -genkeypair -keystore "$RUNNER_TEMP/test.jks" -storepass android-test -keypass android-test \
              -alias upload -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Kotvim Nachon test" -noprompt
            echo "APK_KEYSTORE_FILE=$RUNNER_TEMP/test.jks" >> "$GITHUB_ENV"
            echo "APK_KEYSTORE_PASSWORD=android-test" >> "$GITHUB_ENV"
          else
            echo "APK_KEYSTORE_FILE=$KEYSTORE_FILE" >> "$GITHUB_ENV"
          fi

      - name: Build .apk
        working-directory: kotvim-nachon/android
        env:
          KEYSTORE_FILE: ${{ env.APK_KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ env.APK_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: upload
        run: |
          ./gradlew assembleRelease --no-daemon -PversionCode=${{ github.run_number }}
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/kotvim-nachon.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: kotvim-nachon-apk-${{ github.run_number }}
          path: ${{ runner.temp }}/kotvim-nachon.apk
          if-no-files-found: error

      - name: Publish the .apk (fixed download link)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=kotvim-nachon-latest
          gh release delete "$TAG" --cleanup-tag --yes --repo "$GITHUB_REPOSITORY" || true
          gh release create "$TAG" "$RUNNER_TEMP/kotvim-nachon.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "כותבים נכון – גרסה 1.0.${{ github.run_number }}" \
            --notes "קובץ התקנה לאנדרואיד: מורידים את kotvim-nachon.apk בטלפון ופותחים אותו."
